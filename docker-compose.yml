services:
  api:
    build: .
    image: content-to-post-agent:latest
    env_file: .env
    environment:
      ALLOWED_ORIGINS: http://localhost:3001
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # scheduled_posts.json survives container restarts
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # The browser (not the container) calls the API, so this is the host-visible URL.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: content-to-post-web:latest
    ports:
      - "3001:3001"
    depends_on:
      - api
    restart: unless-stopped
